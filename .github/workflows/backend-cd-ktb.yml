on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login.outputs.registry }}/ktb-backend:latest
            ${{ steps.login.outputs.registry }}/ktb-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Find Backend EC2
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Role,Values=backend" \
              "Name=tag:Environment,Values=prod" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ]; then
            echo "Backend instance not found."
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy through SSM
        id: deploy
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "set -e",
              "cd /home/ubuntu/ktb",
              "echo ECR_REGISTRY=${{ steps.instance.outputs.registry }} > .env.deploy"
              "echo IMAGE_TAG=${{ github.sha }} > .env.deploy"
              "aws ecr get-login-password --region '${{ env.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ steps.login.outputs.registry }}'",
              "docker compose pull",
              "docker compose up -d --remove-orphans",
              "docker image prune -af",
              "curl --fail http://localhost:8080/actuator/health"
            ]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait for SSM command
        run: |

          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
            --instance-id "${{ steps.instance.outputs.INSTANCE_ID }}"

      - name: Check deployment result
        run: |

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
            --instance-id "${{ steps.instance.outputs.INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment Status : $STATUS"

          if [ "$STATUS" != "Success" ]; then

            aws ssm get-command-invocation \
              --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
              --instance-id "${{ steps.instance.outputs.INSTANCE_ID }}"

            exit 1
          fi

          echo "Deployment Success"