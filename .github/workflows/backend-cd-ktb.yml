on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    environment: backend-production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 테스트 DB 컨테이너 실행
        run: docker compose -f github-actions-docker-db.yml up -d --wait --wait-timeout 60

      - name: 테스트 실행
        run: ./gradlew test --no-daemon

      - name: 테스트 컨테이너 정리
        if: always()
        run: docker compose -f github-actions-docker-db.yml down --volumes --remove-orphans

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Push Docker Image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login.outputs.registry }}/ecr-ktb:latest
            ${{ steps.login.outputs.registry }}/ecr-ktb:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Find Backend EC2
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Role,Values=backend" \
              "Name=tag:Environment,Values=prod" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ]; then
            echo "Backend instance not found."
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy through SSM
        id: deploy
        run: |
          COMPOSE_B64=$(base64 -w 0 docker-compose.yml)

          jq -n \
            --arg compose "$COMPOSE_B64" \
            --arg registry "${{ steps.login.outputs.registry }}" \
            --arg region "${{ env.AWS_REGION }}" \
            '{
              commands: [
                "set -e",
                "mkdir -p /home/ubuntu/ktb",
                "cd /home/ubuntu/ktb",
                ("printf %s " + ($compose | @sh) + " | base64 -d > docker-compose.yml"),
                ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
                "docker compose pull",
                "docker compose up -d",
                "docker image prune -af --filter until=72h",
                "curl --fail http://localhost:8080/actuator/health"
              ]
            }' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --region "$AWS_REGION" \
            --query "Command.CommandId" --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
            --instance-id "${{ steps.instance.outputs.INSTANCE_ID }}"

      - name: Check deployment result
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
            --instance-id "${{ steps.instance.outputs.INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment Status : $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "===== SSM STDERR ====="
            aws ssm get-command-invocation \
              --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
              --instance-id "${{ steps.instance.outputs.INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

          echo "Deployment Success"